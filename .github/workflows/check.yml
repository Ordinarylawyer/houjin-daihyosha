name: 検査
on:
  pull_request:
  push:
    branches-ignore: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: 検査とビルド
        run: uv run tools/build.py
      - name: 自動で作るファイルが最新か
        run: |
          if ! git diff --quiet -- docs/07_判定ルール一覧.md seed tests data/法人一覧_調査.csv; then
            echo "::error::自動で作るファイルが更新されていません。uv run tools/build.py を実行して commit してください。"
            git diff --stat
            exit 1
          fi
